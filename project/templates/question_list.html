<h2>Questions</h2>
<a href="{% url 'post_question' %}">Post a Question</a> | <a href="{% url 'logout' %}">Logout</a>
<ul>
{% for question in questions %}
    <li>
        <a href="{% url 'question_detail' question.id %}">{{ question.question }}</a> (created by {{ question.user.username }})
        {% if question.user == user %}
            | <a href="{% url 'delete_question' question.id %}" onclick="return confirm('Are you sure you want to delete this question?')">Delete</a>
        {% endif %}
    </li>
{% endfor %}
</ul>
{% if error %}
    <p style="color: red;">{{ error }}</p>
{% endif %}
